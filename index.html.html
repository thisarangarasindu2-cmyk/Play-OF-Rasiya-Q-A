<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play of Rasiya | Ask Me Anything</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #060913;
            --panel-bg: #0f1626;
            --neon-blue: #00d2fe;
            --neon-purple: #9d4edd;
            --text-light: #f3f4f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: radial-gradient(circle at center, #161233, var(--bg-dark));
            color: var(--text-light); min-height: 100vh; padding: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .main-box {
            max-width: 550px; width: 100%;
            background: var(--panel-bg); border-radius: 24px; padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 25px rgba(0, 210, 254, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Header Layout */
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 {
            font-family: 'Orbitron', sans-serif; font-size: 1.7rem; font-weight: 900;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .header p { color: #9ca3af; font-size: 0.85rem; margin-top: 5px; }

        /* Tabs System to Switch Between Ask and View Modes */
        .tabs { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 1px solid #1f2937; padding-bottom: 10px; }
        .tab-btn {
            background: transparent; border: none; color: #9ca3af; padding: 8px 16px;
            cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: 0.2s;
        }
        .tab-btn.active { color: var(--neon-blue); border-bottom: 2px solid var(--neon-blue); }

        .view-panel { display: none; }
        .view-panel.active { display: block; }

        /* Form Styling */
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .input-group label { font-size: 0.85rem; font-weight: 600; color: #9ca3af; }
        input, textarea {
            background: #172033; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 12px 15px; color: #fff; outline: none; font-size: 0.95rem;
        }
        input:focus, textarea:focus { border-color: var(--neon-blue); }
        textarea { resize: none; height: 120px; }

        .submit-btn {
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            color: #fff; border: none; border-radius: 12px; padding: 14px;
            font-weight: bold; width: 100%; cursor: pointer; font-size: 1rem;
            box-shadow: 0 4px 15px rgba(0, 210, 254, 0.3); transition: 0.2s;
        }
        .submit-btn:hover { transform: translateY(-2px); }

        /* Admin Questions Dashboard List */
        .questions-list { display: flex; flex-direction: column; gap: 15px; max-height: 400px; overflow-y: auto; }
        .q-card {
            background: rgba(255,255,255,0.03); border-radius: 14px; padding: 15px;
            border-left: 4px solid var(--neon-purple); animation: fadeIn 0.3s ease;
        }
        .q-meta { display: flex; justify-content: space-between; font-size: 0.78rem; color: #6b7280; margin-bottom: 5px; }
        .q-author { font-weight: bold; color: var(--neon-blue); }
        .q-text { font-size: 0.95rem; color: #e5e7eb; word-break: break-word; line-height: 1.4; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="main-box">
        <div class="header">
            <h1>Rasiya Q&A Portal</h1>
            <p>Ask anything! Your messages will be delivered straight to Rasiya.</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('ask')"><i class="fa-solid fa-pen-to-square"></i> Ask a Question</button>
            <button class="tab-btn" onclick="switchTab('admin')"><i class="fa-solid fa-lock"></i> Admin Dashboard (Rasiya)</button>
        </div>

        <div id="askPanel" class="view-panel active">
            <div class="input-group">
                <label>Your Name (Optional)</label>
                <input type="text" id="senderName" placeholder="Anonymous / සින්දු" maxlength="20">
            </div>
            <div class="input-group">
                <label>Your Question / Message</label>
                <textarea id="questionText" placeholder="ඔයාට මගෙන් අහන්න ඕන ප්‍රශ්නය මෙතන ලියන්න..."></textarea>
            </div>
            <button class="submit-btn" onclick="submitQuestion()">Send Message <i class="fa-solid fa-paper-plane"></i></button>
        </div>

        <div id="adminPanel" class="view-panel">
            <div class="input-group" id="authBox" style="margin-bottom: 15px;">
                <label>Enter Admin Pin to View Questions</label>
                <div style="display: flex; gap: 10px;">
                    <input type="password" id="adminPin" placeholder="Enter Secret Pin" style="flex:1;">
                    <button class="submit-btn" onclick="unlockDashboard()" style="width:auto; padding: 0 20px;">Unlock</button>
                </div>
            </div>
            
            <div class="questions-list" id="questionsList" style="display: none;">
                </div>
        </div>
    </div>

    <script>
        // ⚠️ මෙතනට ඔයාගේ FIREBASE CONFIG විස්තර ටික දාන්න ⚠️
        const firebaseConfig = { apiKey: "AIzaSyAUArWvMbMbiU9OPx2eWBrqZ8N_wSuGoDg",
  authDomain: "rasiyaaq.firebaseapp.com",
  projectId: "rasiyaaq",
  storageBucket: "rasiyaaq.firebasestorage.app",
  messagingSenderId: "302258992367",
  appId: "1:302258992367:web:089b7e229b1670e222d71a",
  measurementId: "G-5K44BPJKGC"
        };

        // Initialize Cloud Connection
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const qRef = database.ref('user_questions');

        // Secret Admin PIN to view dashboard (ඔයාට කැමති එකක් දාන්න)
        const SECRET_PIN = "rasindu2010"; 

        // Tab Switcher Controller Logic
        function switchTab(type) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.view-panel').forEach(pnl => pnl.classList.remove('active'));

            if(type === 'ask') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('askPanel').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('adminPanel').classList.add('active');
            }
        }

        // Action: Submit Question to Database
        function submitQuestion() {
            let author = document.getElementById('senderName').value.trim();
            const text = document.getElementById('questionText').value.trim();

            if(!author) author = "Anonymous (නිර්නාමික)";
            if(!text) { alert("Please type your question first!"); return; }

            // Push object record package to cloud storage
            qRef.push({
                name: author,
                message: text,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                date: new Date().toLocaleDateString()
            }).then(() => {
                alert("Your question sent successfully! 🚀");
                document.getElementById('questionText').value = "";
            }).catch(err => alert("Error sending: " + err.message));
        }

        // Action: Unlock Private Admin Dashboard Control Panel
        function unlockDashboard() {
            const pinInput = document.getElementById('adminPin').value;
            if(pinInput === SECRET_PIN) {
                document.getElementById('authBox').style.display = 'none';
                const listNode = document.getElementById('questionsList');
                listNode.style.display = 'flex';
                loadIncomingQuestions();
            } else {
                alert("Wrong Admin Pin! Access Denied.");
            }
        }

        // Stream Loader: Sync with Cloud Storage Database Updates
        function loadIncomingQuestions() {
            const listNode = document.getElementById('questionsList');
            listNode.innerHTML = ""; // Clear existing

            qRef.on('child_added', (snapshot) => {
                const data = snapshot.val();
                const card = document.createElement('div');
                card.classList.add('q-card');

                card.innerHTML = `
                    <div class="q-meta">
                        <span class="q-author"><i class="fa-solid fa-user-tag"></i> ${escapeHtml(data.name)}</span>
                        <span><i class="fa-solid fa-clock"></i> ${data.date} | ${data.time}</span>
                    </div>
                    <div class="q-text">${escapeHtml(data.message)}</div>
                `;
                listNode.insertBefore(card, listNode.firstChild); // Newest on top
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
